<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Balraj Pasula - DevOps Engineer in Mumbai, India">
  <style>
    .t{font:15px 'JetBrains Mono','Fira Code',Consolas,monospace;fill:#c9d1d9;white-space:pre}
    .p{fill:#3fb950}.c{fill:#58a6ff}.y{fill:#d29922}.m{fill:#bc8cff}.g{fill:#8b949e}
    .big{font:700 30px 'JetBrains Mono',Consolas,monospace;fill:#f0f6fc}
    .l{opacity:0;animation:show .01s forwards}
    .l1{animation-delay:.4s}.l2{animation-delay:1.1s}.l3{animation-delay:1.8s}.l4{animation-delay:2.4s}
    .l5{animation-delay:3.1s}.l6{animation-delay:3.7s}.l7{animation-delay:4.4s}.l8{animation-delay:5s}
