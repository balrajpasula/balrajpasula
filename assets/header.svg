  <rect fill="#0d1117" width="900" height="300" rx="12"/>
  <rect fill="#161b22" width="900" height="34" rx="12"/>
  <rect fill="#161b22" y="20" width="900" height="14"/>
  <circle cx="22" cy="17" r="6" fill="#ff5f56"/><circle cx="42" cy="17" r="6" fill="#ffbd2e"/><circle cx="62" cy="17" r="6" fill="#27c93f"/>
  <text x="450" y="22" text-anchor="middle" class="t g" style="font-size:13px">balraj@mumbai: ~</text>

  <text x="28" y="76" class="big l l1">Hi, I'm Balraj 👋</text>
  <text x="28" y="104" class="t l l2"><tspan class="c">DevOps Engineer</tspan> <tspan class="g">·</tspan> AWS <tspan class="g">·</tspan> Docker <tspan class="g">·</tspan> Kubernetes <tspan class="g">·</tspan> Linux <tspan class="g">· Mumbai, India</tspan></text>

